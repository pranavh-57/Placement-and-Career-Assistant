services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wayfind
      POSTGRES_PASSWORD: wayfind
      POSTGRES_DB: wayfind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfind"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://wayfind:wayfind@db:5432/wayfind
      CHROMA_PERSIST_DIR: /app/data/chroma
      CORS_ORIGINS: http://localhost:8080
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes: [chroma:/app/data/chroma]
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  chroma:
